name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_PASS" ] && [ -z "$KS_B64" ]; then echo "::error::ANDROID_KEYSTORE_B64 secret is missing - add it so updates install over the old app"; exit 1; fi
          if [ -n "$KS_B64" ]; then printf "%s" "$KS_B64" | tr -d " \r\n" | base64 -d > app/release.keystore; echo "Signing with permanent key"; else echo "No key secret - using debug signing"; fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WPM.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WPM-apk
          path: WPM.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          for i in 1 2 3 4; do
            if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" WPM.apk --clobber && exit 0
            else gh release create "$TAG" WPM.apk --title "WPM $TAG" --notes "Download WPM.apk on your phone and install it, or use Settings > Check for updates in the app." --latest && exit 0; fi
            echo "GitHub error, retrying in 15s"; sleep 15
          done
          exit 1
