name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/release.keystore; echo "Signing with permanent key"; else echo "No key secret - using debug signing"; fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WPM.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WPM-apk
          path: WPM.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" WPM.apk --title "WPM $TAG" --notes "Download WPM.apk on your phone and install it." --latest
